# LLM_MODE=claude_code: the interview runs `claude -p`. With ANTHROPIC_API_KEY in .env it bills the
# company key and CLAUDE_DIR can stay unset (the CLI keeps its state in ./data/claude). Without a key it
# runs on the owner's own Claude Code login: CLAUDE_DIR=~/.claude, mounted read-write so token refreshes persist. Data stays in ./data
# (SQLite, uploads, the Knowledge Source clone).
#
# Production runs from the `main` worktree ~/ticket-sprite-prod, port 3000:
#   docker compose -p ticket-sprite-trial -f docker-compose.single-user.yml up -d --build
# Development runs from ~/ticket-sprite on `develop`, with its own .env and ./data (SPRITE_PORT=3001):
#   docker compose -p ticket-sprite-dev -f docker-compose.single-user.yml up -d --build
# Images are named after the project, so building one site never replaces the other's.
#
# Comes back by itself after a reboot: Docker starts at boot and both services restart unless stopped.
# Needs SPRITE_UID and SPRITE_GID in .env (see .env.example).
name: ticket-sprite-trial

services:
  backend:
    build: ./backend
    restart: unless-stopped
    # The owner's uid, so ./data and ~/.claude stay owned by them
    user: "${SPRITE_UID:?set SPRITE_UID in .env}:${SPRITE_GID:?set SPRITE_GID in .env}"
    # Group that may read the Knowledge Source's origin repo (shared checkouts are often group-owned)
    group_add:
      - "${KNOWLEDGE_SOURCE_GID:-${SPRITE_GID}}"
    env_file: .env
    # Containers don't read the host's /etc/hosts: give Observ the same internal address the VM uses
    extra_hosts:
      - "${OBSERV_HOST:-lighthouse-production.visionai.linkervision.ai}:${OBSERV_IP:?set OBSERV_IP in .env}"
    environment:
      LLM_MODE: claude_code
      HOME: /home/owner
      DATABASE_URL: sqlite+aiosqlite:////data/ticket_sprite.db
      UPLOAD_DIR: /data/uploads
      KNOWLEDGE_ROOT: /data/knowledge
    volumes:
      - ./data:/data
      - ${CLAUDE_DIR:-./data/claude}:/home/owner/.claude
      # Source of the Knowledge Source clone (its origin), same path as on the host
      - /opt/lighthouse-saas-api:/opt/lighthouse-saas-api:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${SPRITE_PORT:-3000}:3000"
    depends_on:
      - backend
